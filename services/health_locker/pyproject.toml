readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "httpx>=0.27.0",
    "langchain-community>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-pinecone>=0.1.0",
    "modal>=0.60.0",
    "psycopg2-binary>=2.9.9",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
